name: CI and Deploy

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit and integration tests
        run: npm test

      - name: Playwright smoke
        run: npm run test:e2e

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://aguynamedtate.github.io/Jumping-JS-Game/
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/

      - name: Deploy production to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: |
            previews

  deploy-feature:
    if: github.ref == 'refs/heads/feature' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: feature
      url: https://aguynamedtate.github.io/Jumping-JS-Game/previews/feature/
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/

      - name: Deploy feature preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: previews/feature

      - name: Preview URL
        run: |
          echo "### Feature preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://aguynamedtate.github.io/Jumping-JS-Game/previews/feature/" >> "$GITHUB_STEP_SUMMARY"

  deploy-pr-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://aguynamedtate.github.io/Jumping-JS-Game/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/

      - name: Deploy PR preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          target-folder: previews/pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://aguynamedtate.github.io/Jumping-JS-Game/previews/pr-${context.payload.pull_request.number}/`;
            const body = `**Preview deploy:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes('**Preview deploy:**')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
